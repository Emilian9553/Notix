    <script>
        // "emerald" ist in Notix die Akzentfarbe: alle emerald-Klassen lesen ihre Farbe aus CSS-Variablen,
        // die beim Wechsel der Akzentfarbe neu gesetzt werden. So färbt sich die ganze App um.
        (function () {
            const shades = [50, 100, 200, 300, 400, 500, 600, 700, 800, 900, 950];
            const accent = {};
            shades.forEach(s => { accent[s] = `rgb(var(--acc-${s}) / <alpha-value>)`; });
            tailwind.config = { theme: { extend: { colors: { emerald: accent } } } };
        })();
    </script>

    <style>

            -webkit-tap-highlight-color: transparent;

        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;

            margin: 0;
            padding: 0;

        }
        ::selection { background: rgb(var(--acc-400)); color: #020617; }
        input, select, textarea, button { font-family: inherit; }
        /* iOS zoomt bei Inputs < 16px – auf dem Handy daher 16px */
        @media (max-width: 640px) {
            input[type="text"], input[type="password"], input[type="date"], input[type="number"], select, textarea { font-size: 16px !important; }

        .bg-notix-universe {
            background-color: #050914;
            background-image:
                radial-gradient(at 10% 12%, rgb(var(--acc-400) / 0.18) 0px, transparent 48%),
                radial-gradient(at 90% 18%, rgba(99, 102, 241, 0.20) 0px, transparent 52%),
                radial-gradient(at 50% 85%, rgba(14, 165, 233, 0.16) 0px, transparent 55%),
                linear-gradient(180deg, #050914 0%, #091226 55%, #050914 100%);
            background-attachment: fixed;
        }

        /* Liquid Glass: Hauptkarten */
        .glass-ultra {
            position: relative;
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.10) 0%, rgba(255, 255, 255, 0.035) 40%, rgba(15, 23, 42, 0.45) 100%);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            box-shadow:
                0 20px 50px -18px rgba(0, 0, 0, 0.65),
                inset 0 1px 0 0 rgba(255, 255, 255, 0.22),
                inset 0 -1px 0 0 rgba(255, 255, 255, 0.04);
            isolation: isolate;
        }
        /* Lichtreflex an der Oberkante */
        .glass-ultra::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background:
                radial-gradient(120% 60% at 15% 0%, rgba(255, 255, 255, 0.11) 0%, transparent 55%),
                radial-gradient(80% 50% at 100% 100%, rgb(var(--acc-400) / 0.07) 0%, transparent 60%);
            pointer-events: none;
            z-index: -1;
        }
        /* Glänzende Glaskante (heller oben links, unten rechts) */
        .glass-ultra::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1px;
            background: linear-gradient(140deg, rgba(255, 255, 255, 0.38) 0%, rgba(255, 255, 255, 0.06) 35%, rgba(255, 255, 255, 0.02) 65%, rgba(255, 255, 255, 0.16) 100%);
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }
        .glass-ultra[class*="border-white"] { border-color: transparent; }
        /* Glas-Pill für aktive Elemente */
        .glass-pill {
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.16), rgba(255, 255, 255, 0.05));
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3), 0 6px 16px -6px rgba(0, 0, 0, 0.5);
        }
        /* Innere Glas-Flächen (Listenzeilen, Panels) */
        .glass-inner {
            background: linear-gradient(160deg, rgba(255, 255, 255, 0.06) 0%, rgba(2, 6, 23, 0.45) 100%);
            border: 1px solid rgba(255, 255, 255, 0.09);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.07);
        }
        /* Eingabefelder */
        .glass-field {
            background: rgba(2, 6, 23, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.13);
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.35);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .glass-field:focus {
            outline: none;
            border-color: rgb(var(--acc-400) / 0.7);
            box-shadow: 0 0 0 3px rgb(var(--acc-400) / 0.15), inset 0 1px 2px rgba(0, 0, 0, 0.35);
        }
        select.glass-field option { background: #0f172a; }
        @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
            .glass-ultra { background: rgba(15, 23, 42, 0.92); }
            .glass-inner { background: rgba(2, 6, 23, 0.85); }
        }

        .glass-dock {
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.62) 0%, rgba(5, 9, 20, 0.82) 100%);
            backdrop-filter: blur(28px) saturate(190%);
            -webkit-backdrop-filter: blur(28px) saturate(190%);
            box-shadow:
                0 10px 40px rgba(0, 0, 0, 0.55),
                inset 0 1px 0 rgba(255, 255, 255, 0.18);
        }
        /* Schwebende Tab-Leiste mit Abstand zum iPhone-Home-Balken */
        .dock-float {
            bottom: calc(10px + var(--safe-bottom));
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .pb-dock { padding-bottom: calc(110px + var(--safe-bottom)); }

        @keyframes floatAurora {
            0%, 100% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(18px, -20px) scale(1.05); }
            66% { transform: translate(-15px, 15px) scale(0.97); }
        }
        .aurora-orb { animation: floatAurora 16s ease-in-out infinite; }
        .aurora-orb-delayed { animation: floatAurora 20s ease-in-out infinite reverse; }

        @keyframes viewEnter {
            0% { opacity: 0; transform: translateY(12px) scale(0.985); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        .animate-view { animation: viewEnter 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        @keyframes scanLaser {
            0% { top: 6%; opacity: 0.9; }
            50% { top: 88%; opacity: 1; }
            100% { top: 6%; opacity: 0.9; }
        }
        .scanner-laser {
            position: absolute;
            left: 4%;
            right: 4%;
            height: 3px;
            background: linear-gradient(90deg, transparent, rgb(var(--acc-400)), #6366f1, rgb(var(--acc-400)), transparent);
            box-shadow: 0 0 18px 4px rgb(var(--acc-400) / 0.7);
            border-radius: 999px;
            animation: scanLaser 2.2s ease-in-out infinite;
        }

        .crop-stage {
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .btn-spring {
            transition: transform 0.16s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease, background-color 0.2s ease;
        }
        .btn-spring:active {
            transform: scale(0.94);
        }

        /* Fokus-Timer Ring */
        .focus-ring-track { stroke: rgba(255, 255, 255, 0.08); }
        .focus-ring-bar { stroke: rgb(var(--acc-400)); filter: drop-shadow(0 0 8px rgb(var(--acc-400) / 0.6)); transition: stroke-dashoffset 0.5s linear; }

        /* Karteikarte umdrehen */
        .flip-card { perspective: 1000px; }
        .flip-inner { position: relative; width: 100%; height: 100%; transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1); transform-style: preserve-3d; }
        .flip-inner.flipped { transform: rotateY(180deg); }
        .flip-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
        .flip-back { transform: rotateY(180deg); }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>

                const m = document.cookie.match(new RegExp('(?:^|; )' + name + '=([^;]*)'));
                return m ? decodeURIComponent(m[1]) : null;
            }
            function writeCookie(name, value) {
                try { document.cookie = `${name}=${encodeURIComponent(value)}; max-age=${60 * 60 * 24 * 365 * 5}; path=/; SameSite=Lax`; } catch (e) {}
            }
            function idbGet(key) {
                return new Promise(resolve => {
                    try {
                        const req = indexedDB.open('notix_device', 1);
                        req.onupgradeneeded = () => req.result.createObjectStore('kv');
                        req.onerror = () => resolve(null);
                        req.onsuccess = () => {
                            try {

            function getEffectiveGradeValue(g) {
                const base = Number(g.value);
                if (isNaN(base)) return null;
                if (!g.tendency) return base;
                if (g.tendency === '+') return Math.max(0.75, base - 0.25);
                if (g.tendency === '-') return Math.min(6.0, base + 0.25);
                return base;
            }

            function formatGradeLabel(g) {
                if (!g) return '–';
                const t = g.tendency === '+' ? '+' : g.tendency === '-' ? '-' : '';
                const v = Number(g.value);
                const num = isNaN(v) ? String(g.value) : (v % 1 === 0 ? String(v) : v.toFixed(2).replace(/0$/, '').replace('.', ','));
                return `${num}${t}`;
            }

            function calcWeightedAvg(grades = [], doubleWeight = 2) {
                if (!grades || grades.length === 0) return null;
                let sum = 0;
                let weightSum = 0;
                for (const g of grades) {
                    const v = getEffectiveGradeValue(g);
                    const w = g.isDouble ? doubleWeight : (Number(g.weight) || 1);
                    if (v !== null && v >= 0.7 && v <= 6) {
                        sum += v * w;
                        weightSum += w;
                    }
                }
                return weightSum > 0 ? sum / weightSum : null;
            }

                if (val === null || val === undefined || isNaN(val)) return '–';

            // Verkleinert Handyfotos vor dem Upload (schneller & unter dem API-Limit)
            function compressDataUrl(srcDataUrl, maxSide = 1600, quality = 0.85) {
                return new Promise((resolve, reject) => {
                    const img = new Image();
                    img.onerror = () => reject(new Error('Bildformat wird nicht unterstützt'));
                    img.onload = () => {
                        const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
                        const canvas = document.createElement('canvas');
                        canvas.width = Math.round(img.width * scale);
                        canvas.height = Math.round(img.height * scale);
                        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                        const dataUrl = canvas.toDataURL('image/jpeg', quality);
                        resolve({ dataUrl, base64: dataUrl.split(',')[1], mimeType: 'image/jpeg' });
                    };
                    img.src = srcDataUrl;
                });
            }
            function compressImageFile(file, maxSide = 1600, quality = 0.85) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onerror = () => reject(new Error('Bild konnte nicht gelesen werden'));
                    reader.onload = () => compressDataUrl(reader.result, maxSide, quality).then(resolve, reject);
                    reader.readAsDataURL(file);
                });
            }

            // ==========================================

                    let cancelled = false;

                        setReady(false);

                        if (!navigator.mediaDevices?.getUserMedia) {
                            setError('Dein Browser erlaubt hier keinen Kamerazugriff (nur über HTTPS möglich).');
                            return;
                        }
                        try {
                            const stream = await navigator.mediaDevices.getUserMedia({
                                video: { facingMode: { ideal: facing }, width: { ideal: 1920 }, height: { ideal: 1080 } },
                                audio: false

                            if (cancelled) { stream.getTracks().forEach(t => t.stop()); return; }
                            streamRef.current = stream;
                            if (videoRef.current) {
                                videoRef.current.srcObject = stream;
                                await videoRef.current.play().catch(() => {});
                            }
                            setReady(true);
                        } catch (e) {
                            setError(e.name === 'NotAllowedError'
                                ? 'Kamerazugriff wurde abgelehnt. Erlaube die Kamera in den Browser-Einstellungen.'
                                : 'Keine Kamera gefunden.');
                        }
                    };
                    start();
                    return () => {
                        cancelled = true;
                        streamRef.current?.getTracks().forEach(t => t.stop());

            // ==========================================
            // FOKUS-TIMER (läuft auch weiter, wenn man den Tab wechselt)
            // ==========================================
            function playChime() {
                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    [660, 880, 1046].forEach((f, i) => {
                        const o = ctx.createOscillator();
                        const g = ctx.createGain();
                        o.type = 'sine';
                        o.frequency.value = f;
                        g.gain.setValueAtTime(0.0001, ctx.currentTime + i * 0.22);
                        g.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + i * 0.22 + 0.02);
                        g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + i * 0.22 + 0.5);
                        o.connect(g); g.connect(ctx.destination);
                        o.start(ctx.currentTime + i * 0.22);
                        o.stop(ctx.currentTime + i * 0.22 + 0.55);
                    });
                } catch (e) {}
                try { navigator.vibrate?.([200, 100, 200]); } catch (e) {}
            }
            function formatClock(sec) {
                const s = Math.max(0, Math.round(sec));
                return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
            }

            // Ruft Gemini mit Bild + Prompt auf und gibt das geparste JSON zurück (oder wirft einen Fehler)
            async function callGeminiVision({ systemPrompt, userText, base64Data, mimeType, responseSchema }) {
                const payload = {
                    contents: [{ role: 'user', parts: [{ text: userText }, { inlineData: { mimeType, data: base64Data } }] }],
                    systemInstruction: { parts: [{ text: systemPrompt }] },
                    generationConfig: { responseMimeType: 'application/json', responseSchema, temperature: 0.2 }
                };
                const proxy = String(AI_PROXY_URL || '').trim().replace(/\/+$/, '');
                if (!proxy) throw new Error('Die KI ist noch nicht eingerichtet (AI_PROXY_URL fehlt – siehe Anleitung, Teil 3)');
                let lastError = 'Keine Antwort von der KI';
                for (const model of GEMINI_MODELS) {
                    try {
                        // Anfrage geht an den eigenen Worker, der den geheimen Key hinzufügt
                        const r = await fetch(`${proxy}/?model=${encodeURIComponent(model)}`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                        if (!r.ok) {
                            let msg = `HTTP ${r.status}`;
                            try { const ej = await r.json(); if (ej?.error?.message) msg = ej.error.message; } catch (e) {}
                            lastError = msg;
                            // Bei ungültigem Key bringt ein anderes Modell nichts
                            if (r.status === 400 && /api key/i.test(msg)) break;
                            if (r.status === 401 || r.status === 403) break;
                            continue;
                        }
                        const js = await r.json();
                        const txt = js?.candidates?.[0]?.content?.parts?.map(p => p.text || '').join('');
                        if (txt) return JSON.parse(txt);
                        lastError = 'Leere Antwort von der KI';
                    } catch (e) {
                        lastError = e.message || 'Netzwerkfehler';
                    }
                }
                throw new Error(lastError);
            }

            const GRADE_WORDS = { 'sehr gut': 1, 'gut': 2, 'befriedigend': 3, 'ausreichend': 4, 'mangelhaft': 5, 'ungenügend': 6, 'ungenuegend': 6 };

            // Wandelt "befriedigend", "2,3", "2-" o.ä. in { value, tendency } um
            function parseGradeInput(raw) {
                if (raw === null || raw === undefined) return null;
                if (typeof raw === 'number') return raw >= 1 && raw <= 6 ? { value: raw, tendency: '' } : null;
                const s = String(raw).trim().toLowerCase();
                if (GRADE_WORDS[s]) return { value: GRADE_WORDS[s], tendency: '' };
                const m = s.match(/^([1-6](?:[.,]\d{1,2})?)\s*([+-])?$/);
                if (!m) return null;
                const value = parseFloat(m[1].replace(',', '.'));
                if (isNaN(value) || value < 1 || value > 6) return null;
                return { value, tendency: m[2] || '' };
            }

            function findPresetForName(name) {
                const n = String(name || '').trim().toLowerCase();
                return PRESET_SUBJECTS_CATALOG.find(p =>
                    p.name.toLowerCase() === n || p.presetId === n ||
                    p.name.toLowerCase().split(/[\s/&]+/).some(part => part.length > 3 && part === n)
                ) || null;
            }

            // Rendert **fett** als <strong>
            function renderBoldText(text) {
                const parts = String(text || '').split(/(\*\*[^*]+\*\*)/g);
                return parts.map((p, i) =>
                    p.startsWith('**') && p.endsWith('**') && p.length > 4
                        ? h('strong', { key: i, className: 'font-black text-white' }, p.slice(2, -2))
                        : h(React.Fragment, { key: i }, p)
                );
            }

            function getDaysUntil(dateStr) {
                if (!dateStr) return null;
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                const target = new Date(dateStr);
                target.setHours(0, 0, 0, 0);
                const diffDays = Math.round((target - today) / (1000 * 60 * 60 * 24));
                if (diffDays < 0) return { text: 'Vorbei', color: 'text-slate-500 bg-slate-900 border-slate-800' };
                if (diffDays === 0) return { text: 'Heute! 🔥', color: 'text-rose-300 bg-rose-500/20 border-rose-400/50 animate-pulse' };
                if (diffDays === 1) return { text: 'Morgen ⚡', color: 'text-amber-300 bg-amber-500/20 border-amber-400/50' };
                if (diffDays <= 7) return { text: `In ${diffDays} Tagen`, color: 'text-indigo-300 bg-indigo-500/20 border-indigo-400/40' };
                return { text: `In ${diffDays} Tagen`, color: 'text-emerald-300 bg-emerald-500/15 border-emerald-400/30' };
            }

                const pushToCloud = async (nextSubjects = subjects, nextExams = exams, nextSettings = settings, accOverride = cloudAccount) => {
                    const key = getAccountDocKey(accOverride);
                    if (!key || !dbRef.current || !fbUser) return;
                    const { db, mods } = dbRef.current;
                    try {
                        const ref = mods.doc(db, ...FS_ROOT, 'accounts', key);
                        const extra = {};
                        Object.keys(extraFieldsRef.current).forEach(f => {
                            const str = JSON.stringify(extraFieldsRef.current[f]);

                            extra[f] = str;
                        });
                        await mods.setDoc(ref, {
                            username: accOverride.username,
                            subjects: JSON.stringify(nextSubjects),
                            exams: JSON.stringify(nextExams),
                            settings: JSON.stringify(nextSettings),

                            updatedAt: Date.now()
                        }, { merge: true });
                    } catch (e) {}
                };

                // To-dos, Stundenplan, Vokabeln & Fokus-Statistik automatisch mit der Cloud abgleichen
                // (ohne Endlosschleife mit dem Snapshot-Listener)
                const extraFields = { todos, timetable2: timetable, vocab, focus: focusStats };
                const extraSetters = { todos: setTodos, timetable2: (t) => setTimetable(cloneTimetable(t)), vocab: setVocab, focus: setFocusStats };
                const extraFieldsRef = useRef(extraFields);
                extraFieldsRef.current = extraFields;
                const lastSyncedRef = useRef({});
                const cloudLoadedRef = useRef(false);
                useEffect(() => {
                    const key = getAccountDocKey(cloudAccount);
                    // Erst pushen, wenn der erste Cloud-Stand geladen wurde (sonst überschreibt ein leeres Gerät die Cloud)
                    if (!key || !dbRef.current || !fbUser || !cloudLoadedRef.current) return;
                    const changed = {};
                    Object.keys(extraFields).forEach(f => {
                        const str = JSON.stringify(extraFields[f]);
                        if (str !== lastSyncedRef.current[f]) { changed[f] = str; lastSyncedRef.current[f] = str; }
                    });
                    if (Object.keys(changed).length === 0) return;
                    const { db, mods } = dbRef.current;
                    mods.setDoc(mods.doc(db, ...FS_ROOT, 'accounts', key), { ...changed, updatedAt: Date.now() }, { merge: true }).catch(() => {});

                // Cloud Snapshot Listener

                    if (!key || !dbRef.current || !fbUser) return;
                    const { db, mods } = dbRef.current;
                    const ref = mods.doc(db, ...FS_ROOT, 'accounts', key);
                    cloudLoadedRef.current = false;
                    const unsub = mods.onSnapshot(ref, (snap) => {
                        const firstLoad = !cloudLoadedRef.current;
                        cloudLoadedRef.current = true;
                        if (snap.exists()) {
                            const data = snap.data();
                            if (data.subjects) {
                                try { const s = JSON.parse(data.subjects); if (Array.isArray(s)) setSubjects(s); } catch (e) {}

                            if (data.exams) {

                            }

                            }
                            Object.keys(extraSetters).forEach(f => {
                                const val = data[f];
                                if (typeof val !== 'string' || val === lastSyncedRef.current[f]) return;
                                try {
                                    const parsed = JSON.parse(val);
                                    if (parsed && typeof parsed === 'object') { lastSyncedRef.current[f] = val; extraSetters[f](parsed); }
                                } catch (e) {}
                            });
                        }
                        // Felder, die es in der Cloud noch nicht gibt, einmalig hochladen
                        if (firstLoad) {
                            const data = snap.exists() ? snap.data() : {};
                            const missing = {};
                            Object.keys(extraFieldsRef.current).forEach(f => {
                                if (typeof data[f] !== 'string') {
                                    const str = JSON.stringify(extraFieldsRef.current[f]);
                                    missing[f] = str; lastSyncedRef.current[f] = str;
                                }
                            });

                }, [enrichedSubjects]);

                // MANUELLER SCHNITT PRO FACH (LÖSCHT ALTE NOTEN & SETZT SCHNITT)
                const handleApplySubjectSchnitt = (e) => {

                    const next = subjects.map(s => s.id === activeSubject.id ? { ...s, strikes: nextVal } : s);

                // ==========================================

                const breakMinutes = focusMinutes >= 45 ? 10 : 5;
                const focusRunning = focusEndAt !== null;

                const finishedForRef = useRef(null);
                useEffect(() => {
                    if (!focusEndAt) return;
                    const tick = () => {
                        const left = (focusEndAt - Date.now()) / 1000;
                        if (left > 0) { setFocusLeft(left); return; }
                        if (finishedForRef.current === focusEndAt) return;
                        finishedForRef.current = focusEndAt;
                        setFocusEndAt(null);
                        playChime();
                        if (focusMode === 'focus') {
                            const dk = todayKey();
                            setFocusStats(prev => ({
                                ...prev,
                                sessions: (prev.sessions || 0) + 1,
                                total: (prev.total || 0) + focusMinutes,
                                days: { ...(prev.days || {}), [dk]: ((prev.days || {})[dk] || 0) + focusMinutes }
                            }));
                            setFocusMode('break');
                            setFocusLeft(breakMinutes * 60);
                            showToast(`Super! ${focusMinutes} Minuten konzentriert 🎉 Zeit für eine Pause.`);
                        } else {
                            setFocusMode('focus');
                            setFocusLeft(focusMinutes * 60);
                            showToast('Pause vorbei – weiter geht\'s! 💪');
                        }
                    };
                    tick();
                    const iv = setInterval(tick, 250);
                    return () => clearInterval(iv);
                }, [focusEndAt, focusMode, focusMinutes, breakMinutes]);
                useEffect(() => {
                    document.title = focusRunning
                        ? `${formatClock(focusLeft)} · ${focusMode === 'focus' ? 'Fokus' : 'Pause'} – Notix`
                        : 'Notix – Smart Grades, KI-Scanner & Hausaufgaben';
                }, [focusRunning, focusLeft, focusMode]);
                const focusStart = () => setFocusEndAt(Date.now() + Math.max(1, focusLeft) * 1000);
                const focusPause = () => { setFocusLeft(Math.max(0, (focusEndAt - Date.now()) / 1000)); setFocusEndAt(null); };
                const focusReset = (mode = focusMode, minutes = focusMinutes) => {
                    setFocusEndAt(null);
                    setFocusMode(mode);
                    setFocusLeft((mode === 'focus' ? minutes : (minutes >= 45 ? 10 : 5)) * 60);
                };
                const focusTodayMin = (focusStats.days || {})[todayKey()] || 0;
                const focusStreak = useMemo(() => {
                    let n = 0;

                    // Heute zählt mit, wenn schon gelernt; sonst ab gestern zählen

                    for (;;) {

                        if ((focusStats.days || {})[k] > 0) { n++; d.setDate(d.getDate() - 1); } else break;
                    }

                // ==========================================

                    setVocabQuiz({
                        ...vocabQuiz,
                        queue,
                        flipped: false,
                        right: vocabQuiz.right + (correct ? 1 : 0),
                        wrong: vocabQuiz.wrong + (correct ? 0 : 1),

                // ZEUGNIS-SCANNER MIT GEMINI KI

REGELN:
1. Schreibe Fachnamen vollständig aus (z.B. "M" -> "Mathematik", "E" -> "Englisch", "D" -> "Deutsch", "Bio" -> "Biologie", "Ph" -> "Physik", "Ch" -> "Chemie", "G" -> "Geschichte", "Geo" -> "Geographie", "WR" -> "Wirtschaft & Recht", "Ku" -> "Kunst", "Mu" -> "Musik", "Sp" -> "Sport", "Rel"/"Eth" -> "Religion / Ethik", "L" -> "Latein", "F" -> "Französisch", "Inf" -> "Informatik").
2. Gib die Note exakt so zurück, wie sie dasteht: als Zahl ("2", "2,3", "3-") ODER als Wort ("sehr gut", "gut", "befriedigend", "ausreichend", "mangelhaft", "ungenügend").

                    try {

                const processHomeworkScan = async (base64Data, mimeType) => {

Analysiere das Bild des Hausaufgabenhefts oder der Tafel.
Erkenne alle Fächer und Aufgaben.

   Beispiel: "**Englisch:** Workbook S. 24 Nr. 3 und Vokabeln Unit 2"
4. Antworte als JSON im Format { "tasks": ["**Englisch:** ...", "**Mathematik:** ..."] }`;

                    try {

                                properties: { tasks: { type: 'ARRAY', items: { type: 'STRING' } } },
                                required: ['tasks']
                            }
                        });
                        const tasks = (Array.isArray(resData?.tasks) ? resData.tasks : [])
                            .map(t => String(t || '').trim())
                            .filter(Boolean)
                            // Sicherstellen, dass das Format "**Fach:** Aufgabe" eingehalten wird
                            .map(t => {
                                if (/^\*\*[^*]+:\*\*/.test(t)) return t;
                                const m = t.match(/^\**\s*([^:*]{1,40}?)\s*\**\s*:\s*\**\s*(.+)$/);
                                return m ? `**${m[1].trim()}:** ${m[2].trim()}` : t;
                            });
                        if (tasks.length > 0) {
                            setHwPendingItems(tasks.map((t, idx) => ({ id: 'hwp-' + idx + '-' + Date.now(), text: t })));
                            showToast(`${tasks.length} Hausaufgaben erkannt – bitte kurz prüfen! 📝`);
                        } else {
                            showToast('Keine Hausaufgaben auf dem Bild erkannt 🤔');
                        }
                    } catch (err) {
                        showToast(`KI-Scan fehlgeschlagen: ${err.message}`);
                    } finally {
                        setIsHwScanning(false);
                    }
                };

                const confirmAndImportHwTasks = () => {
                    if (!hwPendingItems || hwPendingItems.length === 0) return;
                    const newTodos = hwPendingItems
                        .filter(i => i.text.trim())
                        .map((item, idx) => ({
                            id: 'td-' + Date.now() + '-' + idx,
                            text: item.text.trim(),
                            done: false
                        }));
                    setTodos([...newTodos, ...todos]);
                    setHwPendingItems(null);
                    showToast(`${newTodos.length} Aufgaben in To-Do-Liste übernommen! ✅`);
                };

                // RESET & ACCOUNT LÖSCHEN
                const handleExecuteResetAll = () => {
                    setSubjects([]);
                    setExams([]);
                    setTodos([]);
                    try {
                        localStorage.removeItem(STORAGE_KEYS.SUBJECTS);
                        localStorage.removeItem(STORAGE_KEYS.EXAMS);
                        localStorage.removeItem(STORAGE_KEYS.TODOS);
                    } catch (e) {}
                    pushToCloud([], [], settings);
                    setShowResetConfirmModal(false);
                    showToast('Alle Fächer und Noten wurden zurückgesetzt! 🧹');
                };

                const handleExecuteDeleteAccount = async () => {
                    const key = getAccountDocKey(cloudAccount);
                    if (key && dbRef.current && fbUser) {
                        const { db, mods } = dbRef.current;
                        try {
                            const ref = mods.doc(db, 'artifacts', 'notix-app-v3', 'public', 'data', 'accounts', key);
                            await mods.deleteDoc(ref);
                        } catch (e) {}
                    }
                    try {
                        // Alles löschen außer Geräte-ID & Bann-Status
                        Object.values(STORAGE_KEYS).forEach(k => { if (k !== STORAGE_KEYS.DEVICE && k !== STORAGE_KEYS.BANNED) localStorage.removeItem(k); });
                    } catch (e) {}
                    setTimetable(cloneTimetable(DEFAULT_TIMETABLE));
                    setVocab([]);
                    setFocusStats({ days: {}, sessions: 0, total: 0 });
                    setSubjects([]);
                    setExams([]);
                    setTodos([]);
                    setCloudAccount(null);
                    setShowDeleteAccountModal(false);
                    setShowCloudModal(true);
                    showToast('Dein Account und alle Cloud-Daten wurden restlos gelöscht! 👋');
                };

                // Fach-Aktionen
                const handleTogglePresetSubject = (preset) => {
                    const existing = subjects.find(s => s.presetId === preset.presetId || s.name.toLowerCase() === preset.name.toLowerCase());
                    if (existing) {
                        setSelectedSubjectId(existing.id);
                        setEditingSubject({ ...existing });
                        return;
                    }
                    const newSubj = {
                        id: 'subj-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
                        presetId: preset.presetId,
                        name: preset.name,
                        icon: preset.icon,
                        colorId: preset.colorId,
                        category: preset.category,
                        grades: [],
                        strikes: 0,
                        createdAt: Date.now()
                    };
                    const next = [...subjects, newSubj];
                    setSubjects(next);
                    setSelectedSubjectId(newSubj.id);
                    setIsSubjectDetailOpen(true);
                    pushToCloud(next, exams, settings);
                    showToast(`${preset.icon} ${preset.name} hinzugefügt!`);
                };

                const handleAddGrade = (e) => {
                    e.preventDefault();
                    if (!activeSubject) return;
                    const newG = {
                        id: 'g-' + Date.now(),
                        value: Number(gradeVal),
                        tendency: gradeTendency,
                        isDouble: gradeIsDouble,
                        typeLabel: gradeIsDouble ? 'Schulaufgabe' : 'Kurzarbeit / Mündl.',
                        note: gradeNote.trim(),
                        date: new Date().toLocaleDateString('de-DE'),
                        createdAt: Date.now()
                    };
                    const next = subjects.map(s => s.id === activeSubject.id ? { ...s, grades: [...(s.grades || []), newG] } : s);
                    setSubjects(next);
                    setGradeNote('');
                    setGradeTendency('');
                    setGradeEntryStep(1);
                    pushToCloud(next, exams, settings);
                    showToast(`Note ${gradeVal}${gradeTendency} gespeichert! ✅`);
                };

                const handleDeleteGrade = (gradeId) => {
                    if (!activeSubject) return;
                    const next = subjects.map(s => s.id === activeSubject.id ? { ...s, grades: (s.grades || []).filter(g => g.id !== gradeId) } : s);
                    setSubjects(next);
                    pushToCloud(next, exams, settings);
                    showToast('Note gelöscht');
                };

                // Zielnoten-Berechnung
                const targetCalcResult = useMemo(() => {
                    if (!activeSubject) return null;
                    const target = Number(targetBySubj[activeSubject.id] ?? settings.targetOverall ?? 2.0);
                    const grades = activeSubject.grades;
                    const currentAvg = activeSubject.realAvg;
                    const dw = settings.doubleWeightValue;

                    let sum = 0;
                    let wSum = 0;
                    grades.forEach(g => {
                        const w = g.isDouble ? dw : 1;
                        sum += getEffectiveGradeValue(g) * w;
                        wSum += w;
                    });

                    const calcForNextWeight = (nextW) => {
                        if (wSum === 0 || currentAvg === null) {
                            const startGrade = Math.max(1, Math.min(6, Math.floor(target)));
                            return { headline: `Starte mit Note ${startGrade}`, detail: `Mit einer ${startGrade} liegst du sofort auf Kurs.` };
                        }
                        if (currentAvg <= target + 0.001) {
                            return { headline: 'Ziel bereits erreicht! ✅', detail: `Dein Schnitt (${formatGrade(currentAvg, settings.decimals)}) ist schon auf oder über ${formatGrade(target, 1)}.` };
                        }
                        const req = (target * (wSum + nextW) - sum) / nextW;
                        if (req < 1.0) {
                            return { headline: 'In 1 Arbeit nicht machbar', detail: 'Du benötigst mehrere gute Noten (1er/2er) nacheinander.' };
                        }
                        const whole = Math.max(1, Math.min(6, Math.floor(req)));
                        return { headline: `Mindestens Note ${whole}`, detail: `Rechnerisch exakt ${formatGrade(req, 2)} nötig.` };
                    };

                    return { target, doubleRes: calcForNextWeight(dw), singleRes: calcForNextWeight(1) };
                }, [activeSubject, targetBySubj, settings.targetOverall, settings.doubleWeightValue, settings.decimals]);

                // RENDERING DER APP
                // ==========================================

                            )

                                h('div', { className: 'absolute -right-10 -top-10 w-40 h-40 rounded-full bg-emerald-400/20 blur-3xl pointer-events-none' }),
                                h('div', { className: 'relative space-y-1.5' },

                                    h('span', { className: 'text-5xl sm:text-6xl font-black font-mono text-white tracking-tight block' },
                                        formatGrade(metrics.overallAvg, settings.decimals)
                                    ),
                                    h('div', { className: 'text-[11px] text-slate-300 pt-1' },
                                        `${enrichedSubjects.length} ${enrichedSubjects.length === 1 ? 'Fach' : 'Fächer'} • ${metrics.totalGrades} Noten eingetragen`
                                    )
                                )
                            ),

                            h('div', { className: 'grid grid-cols-3 gap-2.5' },
                                [
                                    { label: 'Fokus heute', value: `${focusTodayMin} min`, sub: focusStreak > 0 ? `🔥 ${focusStreak} ${focusStreak === 1 ? 'Tag' : 'Tage'}` : 'Timer starten', tab: 'learn' },
                                    { label: 'Offene Aufgaben', value: String(todos.filter(t => !t.done).length), sub: 'im Planer', tab: 'planner' },
                                    { label: 'Nächste Prüfung', value: nextExam ? (getDaysUntil(nextExam.date)?.text || '–') : '–', sub: nextExam ? nextExam.subjectName : 'keine geplant', tab: 'planner' }
                                ].map(c =>
                                    h('button', { key: c.label, type: 'button', onClick: () => setBottomTab(c.tab), className: 'btn-spring text-left p-3 rounded-2xl glass-inner min-w-0' },
                                        h('span', { className: 'text-[10px] font-bold uppercase tracking-wide text-slate-400 block truncate' }, c.label),

                                    h('button', { onClick: () => { setBottomTab('planner'); setIsTimetableEditing(false); }, className: `text-xs font-bold ${activeAccent.text}` }, 'Stundenplan')
                                ),

                                    const lessons = (timetable[todayWeekday] || []).map((name, i) => ({ i, name: String(name || '').trim() })).filter(x => x.name);

                                    }),
                                    h('div', { className: 'space-y-2 max-h-[420px] overflow-y-auto pr-1' },
                                        list.length === 0 && h('p', { className: 'text-xs text-slate-400 text-center py-4' }, 'Keine Geräte gefunden.'),
                                        list.map(d => {
                                            const isOnline = now - (d.lastSeen || 0) < 2.5 * 60000;
                                            const banned = isDevBanned(d);
                                            const isMe = d.id === deviceId;
                                            const otherNames = (d.names || []).filter(n => n !== d.username);
                                            return h('div', { key: d.id, className: `p-3 rounded-2xl glass-inner flex flex-col sm:flex-row sm:items-center gap-2.5 ${banned ? 'border-rose-500/40' : ''}` },
                                                h('div', { className: 'flex items-center gap-2.5 min-w-0 flex-1' },
                                                    h('span', { className: `w-2.5 h-2.5 rounded-full shrink-0 ${isOnline ? 'bg-green-400 shadow-[0_0_8px_rgba(74,222,128,0.8)]' : 'bg-slate-600'}` }),
                                                    h('div', { className: 'min-w-0' },
                                                        h('span', { className: 'text-sm font-black text-white truncate block' },
                                                            d.username || 'Gast',
                                                            isMe && h('span', { className: 'ml-1.5 text-[10px] font-bold text-emerald-300' }, '(du)'),
                                                            banned && h('span', { className: 'ml-1.5 text-[10px] font-black text-rose-300' }, 'GEBANNT')
                                                        ),
                                                        h('span', { className: 'text-[10px] text-slate-400 block truncate' },
                                                            `${d.device || 'Gerät'} · ${isOnline ? 'online' : timeAgo(d.lastSeen)} · ${d.loginCount || 0} Logins`
                                                        ),
                                                        otherNames.length > 0 && h('span', { className: 'text-[10px] text-amber-300/90 block truncate' }, `Auch als: ${otherNames.join(', ')}`)
                                                    )
                                                ),
                                                !isMe && h('div', { className: 'flex gap-1.5 shrink-0' },
                                                    h('button', { type: 'button', onClick: () => adminKick(d), className: 'btn-spring px-3 py-1.5 rounded-xl bg-amber-500/15 border border-amber-400/30 text-amber-200 text-[11px] font-black' }, 'Kicken'),
                                                    h('button', {
                                                        type: 'button', onClick: () => adminSetBan(d, !banned),
                                                        className: `btn-spring px-3 py-1.5 rounded-xl text-[11px] font-black ${banned ? 'glass-pill text-slate-200' : 'bg-rose-500/20 border border-rose-400/40 text-rose-200'}`
                                                    }, banned ? 'Entbannen' : 'Bannen')
                                                )
                                            );
                                        })
                                    ),
                                    adminBans.length > 0 && h('div', { className: 'space-y-1.5 pt-2 border-t border-white/10' },
                                        h('span', { className: 'text-[11px] font-bold uppercase tracking-wider text-slate-400 block' }, 'Aktive Banns'),
                                        adminBans.map(b =>
                                            h('div', { key: b.id, className: 'flex items-center justify-between gap-2 px-3 py-2 rounded-xl glass-inner' },
                                                h('span', { className: 'text-xs text-white truncate' }, `${b.type === 'user' ? '👤 Name' : '📱 Gerät'}: ${b.label || b.id}`),
                                                h('button', { type: 'button', onClick: () => adminRemoveBan(b.id), className: 'text-[11px] font-bold text-slate-300 hover:text-white shrink-0' }, 'Aufheben')
                                            )
                                        )
                                    ),
                                    h('p', { className: 'text-[10px] text-slate-500' }, 'Bannen sperrt das Gerät und den Usernamen. Kicken meldet nur einmal ab. Chat-Nachrichten kannst du im Chat direkt löschen.')
                                );
                            })()
                        )
                    ),

                    // UNTERE DOCK-LEISTE (7 REITER, schwebend)
                    h('nav', { className: 'fixed inset-x-2.5 sm:inset-x-0 z-40 dock-float sm:mx-auto sm:max-w-xl glass-dock rounded-[26px] px-1 py-1' },
                        h('div', { className: 'grid grid-cols-7 gap-0.5' },
                            [
                                { id: 'dashboard', label: 'Start', icon: Icons.Home },
                                { id: 'subjects', label: 'Fächer', icon: Icons.Book },
                                { id: 'scanner', label: 'Zeugnis', icon: Icons.Scan },
                                { id: 'planner', label: 'Planer', icon: Icons.Calendar },
                                { id: 'learn', label: 'Lernen', icon: Icons.Timer, badge: focusRunning },
                                { id: 'chat', label: 'Chat', icon: Icons.Chat },
                                { id: 'settings', label: 'Menü', icon: Icons.Settings }
                            ].map(item => {
                                const active = bottomTab === item.id;
                                return h('button', {
                                    key: item.id, type: 'button',
                                    onClick: () => { setBottomTab(item.id); window.scrollTo({ top: 0 }); },
                                    'aria-label': item.label,
                                    className: `btn-spring relative flex flex-col items-center justify-center py-1.5 rounded-[20px] transition min-w-0 ${
                                        active ? 'glass-pill text-emerald-300 font-black' : 'text-slate-400 hover:text-slate-200 border border-transparent'
                                    }`
                                },
                                    item.icon('w-5 h-5'),
                                    item.badge && h('span', { className: 'absolute top-1 right-[22%] w-2 h-2 rounded-full bg-emerald-400 animate-pulse' }),
                                    h('span', { className: 'text-[9.5px] sm:text-[10px] mt-0.5 truncate max-w-full' }, item.label)
                                );
                            })
                        )
                    )
                );
            }

            const root = ReactDOM.createRoot ? ReactDOM.createRoot(document.getElementById('root')) : null;
            if (root) { root.render(h(App)); }
            else { ReactDOM.render(h(App), document.getElementById('root')); }
        }
    </script>
</body>
</html>
